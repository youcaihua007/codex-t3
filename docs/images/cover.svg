<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="352" viewBox="0 0 1280 352" role="img" aria-labelledby="title desc">
<title id="title">Codex T3 — Usage Limits Widget</title>
<desc id="desc">A small native macOS usage widget. Flat ivory, charcoal lettering, and the app's C-and-12-dot mark at its original proportions, inspired by Braun T3.</desc>
<rect width="1280" height="352" rx="30" fill="#e7e5da"/>
<g font-family="Helvetica Neue,Helvetica,Arial,sans-serif" fill="#31342e">
<text x="64" y="63" font-size="14" letter-spacing="3">DESKTOP / MENU BAR / macOS</text>
<text x="60" y="163" font-size="74" font-weight="600" letter-spacing="-3">Codex T3</text>
<text x="64" y="206" font-size="24" fill="#74766e">Small app. Quiet design.</text>
<path d="M64 260H1216" stroke="#c8c8bd"/>
<circle cx="71" cy="300" r="7" fill="#c35e32"/>
<text x="94" y="306" font-size="16" letter-spacing="1">2.42 MB DMG · NATIVE macOS</text>
<text x="1198" y="306" font-size="16" text-anchor="end" fill="#74766e">01 / 1.1</text>
</g>
<!-- Same geometry as MenuBarSymbol.make(), scaled equally in both axes. -->
<g transform="translate(868 42) scale(12.5)" stroke="#31342e" fill="none">
<rect x="0.8" y="2" width="20.4" height="14" rx="2.5" stroke-width="1.35"/>
<path d="M8.9748737 6.5251263 A3.5 3.5 0 1 0 8.9748737 11.4748737" stroke-width="1.55" stroke-linecap="round"/>
<g fill="#31342e" stroke="none">
<circle cx="13.2" cy="5.4" r="0.625"/><circle cx="15.6" cy="5.4" r="0.625"/><circle cx="18" cy="5.4" r="0.625"/>
<circle cx="13.2" cy="7.8" r="0.625"/><circle cx="15.6" cy="7.8" r="0.625"/><circle cx="18" cy="7.8" r="0.625"/>
<circle cx="13.2" cy="10.2" r="0.625"/><circle cx="15.6" cy="10.2" r="0.625"/><circle cx="18" cy="10.2" r="0.625"/>
<circle cx="13.2" cy="12.6" r="0.625"/><circle cx="15.6" cy="12.6" r="0.625"/><circle cx="18" cy="12.6" r="0.625"/>
</g>
</g>
</svg>
